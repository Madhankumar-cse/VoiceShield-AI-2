<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceShield AI | Next-Gen Voice Defense</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(31, 41, 55, 0.8);
            --primary-accent: #38bdf8;
            --secondary-accent: #6366f1;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 28px;
            background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand h1 span {
            color: var(--primary-accent);
        }

        .badge {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #818cf8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(3, 7, 18, 0.6);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--secondary-accent) 0%, #3b82f6 100%);
            color: white;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.45);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
            margin-top: 20px;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 380px;
            text-align: center;
        }

        .gauge-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: conic-gradient(from 180deg, #10b981 0%, #f59e0b 50%, #ef4444 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 20px 0;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .gauge-inner {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #0B1120;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-value {
            font-size: 42px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
        }

        .score-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        .status-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            margin-top: 12px;
            display: inline-block;
        }

        .status-pending { background: rgba(156, 163, 175, 0.1); color: var(--text-muted); }
        .status-safe { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-warn { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Custom File Upload Box */
        .file-upload-box {
            border: 2px dashed var(--card-border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: rgba(3, 7, 18, 0.3);
            cursor: pointer;
            transition: border-color 0.2s ease;
            margin-bottom: 16px;
        }

        .file-upload-box:hover {
            border-color: var(--primary-accent);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">
            <span class="brand-icon">🛡️</span>
            <h1>VoiceShield <span>AI</span></h1>
        </div>
        <div class="badge">SIH 2026 QUALIFIED</div>
    </div>

    <div class="dashboard-grid">
        <!-- Left Control Panel -->
        <div class="glass-card">
            <div class="card-title">📞 Incident Parameters</div>
            
            <div class="form-group">
                <label>Caller Identity</label>
                <input type="text" id="caller_name" class="form-control" value="CEO Arun Kumar">
            </div>

            <div class="form-group">
                <label>Inbound Line ID</label>
                <input type="text" id="phone_number" class="form-control" value="+91 98765 43210">
            </div>

            <div class="form-group">
                <label>Stated Purpose</label>
                <select id="purpose" class="form-control">
                    <option>Urgent Fund Transfer</option>
                    <option>Data Request</option>
                    <option>Account Verification</option>
                </select>
            </div>

            <div style="border-top: 1px solid var(--card-border); margin: 20px 0;"></div>

            <div class="card-title">🎵 Audio Input Payload</div>

            <div class="file-upload-box" onclick="document.getElementById('audio_file').click();">
                <p style="font-size: 12px; color: var(--text-muted);">Click to choose audio file</p>
                <p id="file_name_display" style="font-size: 11px; color: var(--primary-accent); font-weight: 600; margin-top: 4px;"></p>
                <input type="file" id="audio_file" accept="audio/*" style="display: none;" onchange="showFileName()">
            </div>

            <button class="btn-primary" onclick="analyzeAudio()">🔍 RUN FORENSIC ANALYSIS</button>
        </div>

        <!-- Right Results Panel -->
        <div class="glass-card results-container">
            <div class="card-title" style="align-self: flex-start;">📊 Real-time Authenticity Evaluation</div>

            <div class="gauge-circle">
                <div class="gauge-inner">
                    <div class="score-value" id="risk_display">0.0%</div>
                    <div class="score-label">Clone Risk</div>
                </div>
            </div>

            <div id="status_pill" class="status-badge status-pending">Awaiting Audio Payload</div>

            <p id="status_text" style="font-size: 12px; color: var(--text-muted); margin-top: 14px; max-width: 380px;">
                Upload a voice recording (`.wav`, `.mp3`, `.m4a`) and initiate the evaluation sequence.
            </p>

            <button id="pdf_btn" class="btn-primary btn-success" onclick="downloadPDF()" style="display: none; width: auto; padding: 12px 24px;">
                📥 EXPORT FORENSIC PDF REPORT PACK
            </button>
        </div>
    </div>

    <script>
        let currentScore = 0;

        function showFileName() {
            const input = document.getElementById('audio_file');
            if (input.files[0]) {
                document.getElementById('file_name_display').innerText = input.files[0].name;
            }
        }

        async function analyzeAudio() {
            const fileInput = document.getElementById('audio_file');
            if (!fileInput.files[0]) {
                alert('Please select an audio file first!');
                return;
            }

            document.getElementById('status_text').innerText = 'Extracting 40 MFCC coefficients & spectral centroids...';
            const formData = new FormData();
            formData.append('audio', fileInput.files[0]);

            try {
                const res = await fetch('/analyze', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.status === 'success') {
                    currentScore = data.risk_score;
                    document.getElementById('risk_display').innerText = currentScore + '%';
                    
                    const pill = document.getElementById('status_pill');
                    if (currentScore < 40) {
                        pill.className = "status-badge status-safe";
                        pill.innerText = "AUTHENTIC VOICE DETECTED";
                    } else if (currentScore < 75) {
                        pill.className = "status-badge status-warn";
                        pill.innerText = "SUSPICIOUS MODULATION DETECTED";
                    } else {
                        pill.className = "status-badge status-danger";
                        pill.innerText = "CRITICAL HIGH AI CLONE RISK";
                    }

                    document.getElementById('status_text').innerText = 'Analysis successfully completed & cryptographically verified.';
                    document.getElementById('pdf_btn').style.display = 'inline-block';
                }
            } catch (err) {
                alert('Server response error. Please try again.');
            }
        }

        async function downloadPDF() {
            const payload = {
                caller_name: document.getElementById('caller_name').value,
                phone_number: document.getElementById('phone_number').value,
                purpose: document.getElementById('purpose').value,
                risk_score: currentScore
            };

            const response = await fetch('/download-pdf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `VoiceShield_Report.pdf`;
            a.click();
        }
    </script>
</body>
</html>
